name: Newsroom OAuth checks
on:
  pull_request:
permissions:
  contents: read
jobs:
  newsroom-changes:
    runs-on: ubuntu-latest
    outputs:
      affected: ${{ steps.paths.outputs.affected }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- workers/newsroom .github/workflows/newsroom-oauth.yml; then
            echo 'affected=false' >> "$GITHUB_OUTPUT"
          else
            result=$?
            if [ "$result" -ne 1 ]; then exit "$result"; fi
            echo 'affected=true' >> "$GITHUB_OUTPUT"
          fi
  local-oauth:
    needs: newsroom-changes
    if: needs.newsroom-changes.outputs.affected == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: workers/newsroom/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: workers/newsroom
      - run: npm run typecheck && npm test && npm run build && npm run build:test && npm run build:issuer-candidate && npm run build:resource-candidate && npm run build:resource-s3-candidate && npm run build:hosted-recovery && npm run build:current-acceptance && npm run build:editor-gateway && node acceptance/current-harness-check.mjs
        working-directory: workers/newsroom
      - name: Check private receiver start without cloud access
        run: python3 -B acceptance/current-mac-receiver-check.py
        working-directory: workers/newsroom
      - name: Save validated release bundle for isolated hosted test
        uses: actions/upload-artifact@v4
        with:
          name: newsroom-oauth-pr-bundle
          path: workers/newsroom/dist/worker.js
          if-no-files-found: error
          retention-days: 7
      - name: Save unbound resource candidate for source review only
        uses: actions/upload-artifact@v4
        with:
          name: newsroom-resource-candidate-pr-bundle
          path: workers/newsroom/dist/resource-candidate.js
          if-no-files-found: error
          retention-days: 7
      - name: Temporary one-time nonsecret bundle transfer digest
        shell: bash
        working-directory: workers/newsroom
        run: |
          python3 - <<'PY'
          import base64, gzip
          from pathlib import Path
          for name in ('editor-gateway-candidate', 'issuer-editor-candidate'):
              raw = Path('dist', name + '.js').read_bytes()
              print('BEGIN_NONSECRET_BUNDLE_' + name)
              print(base64.b64encode(gzip.compress(raw, compresslevel=9, mtime=0)).decode('ascii'))
              print('END_NONSECRET_BUNDLE_' + name)
          PY
      - name: Save isolated Editor gateway and issuer candidate bundles for hosted acceptance
        uses: actions/upload-artifact@v4
        with:
          name: newsroom-editor-gateway-isolated-bundles
          path: |
            workers/newsroom/dist/editor-gateway-candidate.js
            workers/newsroom/dist/issuer-editor-candidate.js
          if-no-files-found: error
          retention-days: 7
      - name: Save unbound issuer candidate for source review only
        uses: actions/upload-artifact@v4
        with:
          name: newsroom-issuer-candidate-pr-bundle
          path: workers/newsroom/dist/issuer-candidate.js
          if-no-files-found: error
          retention-days: 7
      - name: Save experimental S3 read-only resource candidate for review only
        uses: actions/upload-artifact@v4
        with:
          name: newsroom-resource-s3-candidate-pr-bundle
          path: workers/newsroom/dist/resource-s3-candidate.js
          if-no-files-found: error
          retention-days: 7

  newsroom-readiness:
    name: Newsroom readiness gate
    if: always()
    needs: [newsroom-changes, local-oauth]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful applicable checks
        env:
          DETECTION_RESULT: ${{ needs.newsroom-changes.result }}
          AFFECTED: ${{ needs.newsroom-changes.outputs.affected }}
          OAUTH_RESULT: ${{ needs.local-oauth.result }}
        shell: bash
        run: |
          set -euo pipefail
          test "$DETECTION_RESULT" = success
          if [ "$AFFECTED" = true ]; then
            test "$OAUTH_RESULT" = success
          elif [ "$AFFECTED" = false ]; then
            test "$OAUTH_RESULT" = skipped
          else
            exit 1
          fi
