name: Newsroom OAuth checks
on:
  pull_request:
    paths:
      - 'workers/newsroom/**'
      - '.github/workflows/newsroom-oauth.yml'
permissions:
  contents: read
jobs:
  local-oauth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: workers/newsroom/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: workers/newsroom
      - run: npm run typecheck && npm test && npm run build && npm run build:test
        working-directory: workers/newsroom
