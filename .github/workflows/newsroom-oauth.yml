name: Newsroom OAuth checks
on:
  pull_request:
    paths:
      - 'workers/newsroom/**'
      - '.github/workflows/newsroom-oauth.yml'
permissions:
  contents: read
jobs:
  local-oauth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: workers/newsroom/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: workers/newsroom
      - run: npm run typecheck && npm test && npm run build && npm run build:test && npm run build:issuer-candidate && npm run build:resource-candidate
        working-directory: workers/newsroom
      - name: Save validated release bundle for isolated hosted test
        uses: actions/upload-artifact@v4
        with:
          name: newsroom-oauth-pr-bundle
          path: workers/newsroom/dist/worker.js
          if-no-files-found: error
          retention-days: 7
      - name: Save unbound resource candidate for source review only
        uses: actions/upload-artifact@v4
        with:
          name: newsroom-resource-candidate-pr-bundle
          path: workers/newsroom/dist/resource-candidate.js
          if-no-files-found: error
          retention-days: 7
      - name: Save unbound issuer candidate for source review only
        uses: actions/upload-artifact@v4
        with:
          name: newsroom-issuer-candidate-pr-bundle
          path: workers/newsroom/dist/issuer-candidate.js
          if-no-files-found: error
          retention-days: 7
