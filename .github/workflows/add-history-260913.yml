name: Add constitutional history entry 260913

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-history-260913.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Add history entry
        run: python3 scripts/add-history-260913.py
      - name: Validate site build and ordering
        run: |
          npm ci
          npm run build
          python3 - <<'PY'
          from pathlib import Path
          s=Path('constitutional-history.html').read_text(encoding='utf-8')
          assert s.count('Session 260913 &middot; Constitutional') == 1
          assert 'Articles I&ndash;XX &mdash; Structural Consolidation and Consistency Review' in s
          assert s.index('Session 260913 &middot; Constitutional') < s.index('Session 260907 &middot; Constitutional')
          print('History entry and ordering validated.')
          PY
      - name: Remove temporary machinery and commit
        run: |
          rm -f scripts/add-history-260913.py
          rm -f .github/workflows/add-history-260913.yml
          git config user.name 'jcr0916-hue'
          git config user.email 'jcr0916@gmail.com'
          git add -A constitutional-history.html scripts/add-history-260913.py .github/workflows/add-history-260913.yml
          git commit -m 'Record September 2026 structural constitutional review'
          git push origin HEAD:main
