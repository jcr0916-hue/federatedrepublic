name: Repair PR 219 generated Constitution
on:
  push:
    branches:
      - fix/repair-constitution-after-pr219
permissions:
  contents: write
jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/repair-constitution-after-pr219
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore generated Markdown without archiving invalid pair
        run: |
          python3 - <<'PY'
          import json, runpy
          from pathlib import Path
          source = Path('constitution_data.json').read_bytes()
          renderer = runpy.run_path('scripts/build-constitution-md.py')['render']
          target = renderer(json.loads(source))
          Path('docs/constitution-current.md').write_text(target, encoding='utf-8')
          PY
      - name: Regenerate dependent text, annotation and search index
        run: |
          python3 scripts/build-quickref.py constitution_data.json docs/constitutional-quickref.md
          python3 scripts/sync-annotated.py
          python3 scripts/build-search-index.py
          python3 -B scripts/constitution-archive.py check-current
      - name: Commit corrected generated files
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/constitution-current.md docs/constitutional-quickref.md annotated.html search-index.js
          if ! git diff --cached --quiet; then
            git commit -m 'Regenerate constitutional publications after PR 219'
            git push origin HEAD:fix/repair-constitution-after-pr219
          fi
