name: Patch Ordinary Law terminology 260913

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-ordinary-law-260913.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply targeted patch
        run: python3 scripts/patch-ordinary-law-260913.py
      - name: Validate site build and stale wording
        run: |
          npm ci
          npm run build
          python3 - <<'PY'
          from pathlib import Path
          ordinary = Path('scenario-ordinary.html').read_text(encoding='utf-8')
          home = Path('index.html').read_text(encoding='utf-8')
          for stale in ('Asylum Court', 'ASYLUM COURT', 'the EI&#8217;s summary', 'the LI&#8217;s audit finding'):
              if stale in ordinary:
                  raise SystemExit(f'Stale Ordinary Law wording remains: {stale}')
          if 'Asylum Court' in home:
              raise SystemExit('Homepage Ordinary Law feature still says Asylum Court')
          for required in ('independent federal asylum adjudicative process', 'ASYLUM ADJUDICATION DATE ASSIGNED', 'the EM&#8217;s summary', 'the LM&#8217;s audit finding'):
              if required not in ordinary:
                  raise SystemExit(f'Missing updated Ordinary Law wording: {required}')
          if 'Asylum Process' not in home:
              raise SystemExit('Homepage feature missing Asylum Process label')
          print('Ordinary Law targeted validation passed.')
          PY
      - name: Remove temporary machinery and commit
        run: |
          rm -f scripts/patch-ordinary-law-260913.py
          rm -f .github/workflows/patch-ordinary-law-260913.yml
          git config user.name 'jcr0916-hue'
          git config user.email 'jcr0916@gmail.com'
          git add -A index.html scenario-ordinary.html scripts/patch-ordinary-law-260913.py .github/workflows/patch-ordinary-law-260913.yml
          git commit -m 'Align Ordinary Law with current asylum architecture'
          git push origin HEAD:main
