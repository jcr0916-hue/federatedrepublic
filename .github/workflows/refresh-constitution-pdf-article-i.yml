name: Refresh canonical Constitution PDF for Article I start
on:
  push:
    branches: [fix/remove-stale-annotated-preamble-20261013]
permissions:
  contents: write
jobs:
  refresh-pdf:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Serve built site and regenerate accessible PDF
        run: |
          python3 -m http.server 8765 --directory _site >/tmp/constitution-http.log 2>&1 &
          for i in $(seq 1 45); do
            if curl --fail --silent http://localhost:8765/constitution-print.html >/dev/null; then break; fi
            sleep 1
          done
          node scripts/build-constitution-pdf.cjs http://localhost:8765
      - name: Check removal and complete PDF contents
        run: |
          python3 -m pip install pypdf
          python3 scripts/check-constitution-pdf.py
          python3 scripts/check-constitutional-site.py
      - name: Commit updated PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pdf/constitution-current.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate Constitution PDF without Preamble"
            git push
          fi
