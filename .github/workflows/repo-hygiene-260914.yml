name: Repository hygiene 260914
on:
  push:
    paths:
      - '.github/workflows/repo-hygiene-260914.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Reorganize archival documentation
        run: |
          mkdir -p docs/archive/constitution docs/archive/reviews docs/archive/project docs/archive/decisions
          git mv docs/Constitution-260914.md docs/archive/constitution/Constitution-260914.md
          git mv docs/CONSTITUTION-AUDIT-260914.md docs/archive/reviews/CONSTITUTION-AUDIT-260914.md
          git mv docs/CONSTITUTION-REVIEW-OPEN.md docs/archive/reviews/CONSTITUTION-REVIEW-OPEN.md
          git mv docs/CONTENT-PLAN-13-09.md docs/archive/project/CONTENT-PLAN-13-09.md
          git mv docs/MIGRATION-CHECKLIST.md docs/archive/project/MIGRATION-CHECKLIST.md
          git mv docs/REORG-PLAN.md docs/archive/project/REORG-PLAN.md
          git mv docs/SITE-REFRESH-PLAN.md docs/archive/project/SITE-REFRESH-PLAN.md
          git mv docs/STATE-PAGES-PLAN.md docs/archive/project/STATE-PAGES-PLAN.md
          git mv 'docs/SUCCESSION-ELIGIBILITY-PRINCIPLE 2.md' docs/archive/decisions/SUCCESSION-ELIGIBILITY-PRINCIPLE.md
          git mv docs/SECTION-15-10-STATE-INCAPACITY-DECIDED.md docs/archive/decisions/SECTION-15-10-STATE-INCAPACITY-DECIDED.md
          git mv docs/SECTION-2-6-A-REDESIGN-DECIDED.md docs/archive/decisions/SECTION-2-6-A-REDESIGN-DECIDED.md
      - name: Remove proven obsolete duplicates and scaffolding
        run: |
          rm scenarios-FINAL.html
          rm feed-snippets.html
      - name: Make scenarios library single-source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/build-scenario-index.py')
          t = p.read_text()
          t = t.replace("# Retain the legacy URL as an identical, current library rather than a stale second index.\nPath('scenarios-FINAL.html').write_text(page)\nprint(f'Synchronized {len(entries)} scenarios and {len(featured[\"entries\"])} featured entries in both libraries.')", "print(f'Synchronized {len(entries)} scenarios and {len(featured[\"entries\"])} featured entries in the scenario library.')")
          p.write_text(t)

          p = Path('scripts/check-scenarios.py')
          t = p.read_text()
          t = t.replace('"""Check scenario references, built links, and synchronization of the two libraries."""', '"""Check scenario references, built links, and scenario-library metadata."""')
          t = t.replace("library = Path('scenarios.html').read_text()\nassert library == Path('scenarios-FINAL.html').read_text()\n", "library = Path('scenarios.html').read_text()\n")
          p.write_text(t)
          PY
      - name: Add repository documentation map
        run: |
          cat > docs/README.md <<'EOF'
          # Repository documentation map

          This directory contains both current project references and historical material. Files under `archive/` are retained for project history and should not be treated as current authority.

          ## Current constitutional sources

          - `../constitution_data.json` — canonical structured source for the current federal Constitution.
          - `constitution-current.md` — generated current Markdown text of the Constitution.
          - `constitutional-quickref.md` — generated current constitutional quick reference.
          - `../annotated.html` — generated/live annotated Constitution surface.
          - `../search-index.js` — generated search data derived from current constitutional text.
          - `../pdf/constitution-current.pdf` — current downloadable Constitution PDF.

          Edit the canonical structured source and regenerate derived constitutional surfaces rather than editing generated copies independently.

          ## Active project references

          Current design principles, world canon, character references, timelines, arc notes, deployment notes, and active queues remain directly under `docs/` until a later structural reorganization is worthwhile.

          ## Archive

          - `archive/constitution/` — dated snapshots of earlier constitutional text.
          - `archive/reviews/` — completed constitutional review and audit records.
          - `archive/project/` — completed or superseded implementation/content/reorganization plans.
          - `archive/decisions/` — resolved design-decision records retained for rationale and history.

          Archive material may describe older file counts, institutional wording, workflows, or site architecture. The current repository and current Constitution control where they differ.
          EOF
      - name: Regenerate scenario library
        run: python3 scripts/build-scenario-index.py
      - name: Install dependencies
        run: npm ci
      - name: Build site
        run: npm run build
      - name: Validate scenario library
        run: python3 scripts/check-scenarios.py
      - name: Validate constitutional consistency
        run: python3 scripts/check-consistency.py
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/repo-hygiene-260914.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Clean repository archives and duplicate scaffolding'
          git push
