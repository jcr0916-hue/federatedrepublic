name: Adoption Candidate Validation

on:
  push:
    branches:
      - working-fiscal-draft-and-principle-test-261020
    paths:
      - 'docs/adoption-candidate-constitution.md'
      - 'docs/adoption-candidate-data.json'
      - 'torenthia-nrs-103.html'
      - 'scripts/prepare-adoption-candidate.py'
      - '.github/workflows/adoption-candidate-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare staged canonical JSON with clean text
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re, runpy
          root = Path('.')
          candidate = json.loads((root/'docs/adoption-candidate-data.json').read_text())
          assert len(candidate) == 20
          assert sum(len(a['provisions']) for a in candidate) == 177
          ids = [p['num'] for a in candidate for p in a['provisions']]
          assert len(set(ids)) == 177
          render = runpy.run_path('scripts/build-constitution-md.py')['render']
          generated = render(candidate)
          expected = (root/'docs/adoption-candidate-constitution.md').read_text()
          def normal(t):
              return '\n'.join(line.strip() for line in t.strip().splitlines() if line.strip() and line.strip() != '---')
          assert normal(generated).split('## Article I', 1)[1] == normal(expected).split('## Article I', 1)[1]
          print('PASS: 20 articles, 177 unique provisions, generator text equivalence.')
          PY
      - name: Recreate candidate JSON and compare
        run: |
          cp docs/adoption-candidate-data.json /tmp/adoption-candidate-data.json
          python3 scripts/prepare-adoption-candidate.py
          diff -u /tmp/adoption-candidate-data.json docs/adoption-candidate-data.json
      - name: Build isolated candidate site and annotated edition
        run: |
          mkdir -p "$RUNNER_TEMP/candidate-site"
          rsync -a --exclude='.git' --exclude='node_modules' ./ "$RUNNER_TEMP/candidate-site/"
          cd "$RUNNER_TEMP/candidate-site"
          cp docs/adoption-candidate-data.json constitution_data.json
          python3 scripts/sync-annotated.py
          python3 scripts/build-search-index.py
          python3 scripts/build-constitution-md.py constitution_data.json docs/candidate-generated.md
          cp docs/candidate-generated.md docs/constitution-current.md
          python3 scripts/check-constitutional-site.py
          npm ci
          npx eleventy
          test -s _site/annotated.html
          test -s _site/constitution-print.html
          grep -q '§15.2.a' _site/annotated.html
          grep -q '§18.3' _site/constitution-print.html
          echo 'PASS: isolated annotated edition and print website were built with candidate data.'
      - name: Generate and validate isolated candidate PDF
        run: |
          cd "$RUNNER_TEMP/candidate-site"
          python3 -m pip install --quiet pypdf
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          python3 -m http.server 8765 --directory _site >/tmp/candidate-http.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          mkdir -p pdf
          node scripts/build-constitution-pdf.cjs http://localhost:8765
          python3 scripts/check-constitution-pdf.py
          python3 scripts/check-pdf-accessibility.py
          echo 'PASS: candidate PDF content and accessibility checked.'
