name: Validate World updates 260914
on:
  push:
    paths:
      - '.github/workflows/validate-world-updates-260914.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Build site
        run: npm run build
      - name: Verify new pages and collection metadata
        run: |
          test -f _site/torenthia-news-070.html
          test -f _site/torenthia-news-071.html
          grep -q 'worldSeq: 109' torenthia-news-070.html
          grep -q 'worldSeq: 110' torenthia-news-071.html
          grep -q 'Caldris Says Yes to the Meeting' _site/torenthia-news-070.html
          grep -q 'The South Loop Is Back on Schedule' _site/torenthia-news-071.html
          grep -q 'Caldris Says Yes to the Meeting' _site/torenthia.html
          grep -q 'The South Loop Is Back on Schedule' _site/torenthia.html
          grep -q 'Caldris Says Yes to the Meeting' _site/torenthia-record.html
          grep -q 'The South Loop Is Back on Schedule' _site/torenthia-record.html
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/validate-world-updates-260914.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Validate Torenthia World updates'
          git push