name: World publishing
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  publish-check:
    name: World publishing check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run world:publish-check
