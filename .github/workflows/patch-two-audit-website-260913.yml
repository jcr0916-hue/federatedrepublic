name: Patch two-audit website references 260913

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-two-audit-website-260913.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply targeted website patch
        run: |
          python3 scripts/patch-two-audit-website-260913.py
          python3 scripts/fix-two-audit-scenario-index-260913.py
      - name: Validate website build and stale wording
        run: |
          npm ci
          npm run build
          python3 - <<'PY'
          from pathlib import Path
          checks = {
            'glossary.html': ['intermediate constitutional stage between Territory and full State'],
            'quicksheet-states.html': ['Passing confers Statehood immediately by constitutional operation', 'the Audit alone'],
            'scenario-the-audit.html': ['Passing the Statehood Audit is a constitutional trigger', 'Immediate Statehood, followed by a special Senate election within 90 days'],
            'scenarios.html': ['A Territory passes the Statehood Audit, with clean findings from all three Monitors'],
            'scenarios-FINAL.html': ['A Territory passes the Statehood Audit, with clean findings from all three Monitors'],
          }
          bad=[]
          for path, phrases in checks.items():
              text=Path(path).read_text(encoding='utf-8')
              for phrase in phrases:
                  if phrase in text:
                      bad.append(f'{path}: {phrase}')
          if bad:
              raise SystemExit('Stale wording remains:\n'+'\n'.join(bad))
          required = {
            'glossary.html': 'Statehood Proceeding',
            'quicksheet-states.html': 'First Successful Audit',
            'scenario-the-audit.html': 'second successful Statehood Audit',
            'scenarios.html': 'The first success kept it a Territory',
            'scenarios-FINAL.html': 'The first success kept it a Territory',
          }
          for path, phrase in required.items():
              if phrase not in Path(path).read_text(encoding='utf-8'):
                  raise SystemExit(f'Missing expected updated wording in {path}: {phrase}')
          print('Targeted website wording validated.')
          PY
      - name: Remove temporary patch machinery
        run: |
          rm -f scripts/patch-two-audit-website-260913.py
          rm -f scripts/fix-two-audit-scenario-index-260913.py
          rm -f .github/workflows/patch-two-audit-website-260913.yml
      - name: Commit targeted website correction
        run: |
          git config user.name 'jcr0916-hue'
          git config user.email 'jcr0916@gmail.com'
          git add -A glossary.html quicksheet-states.html scenario-the-audit.html scenarios.html scenarios-FINAL.html api/navigator.js scripts/patch-two-audit-website-260913.py scripts/fix-two-audit-scenario-index-260913.py .github/workflows/patch-two-audit-website-260913.yml
          git commit -m 'Align website with two-audit Statehood pathway'
          git push origin HEAD:main
