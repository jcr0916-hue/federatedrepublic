name: Fix executive incapacity cross references

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-executive-incapacity-crossrefs-260915.yml'
      - 'scripts/fix-executive-incapacity-crossrefs-260915.py'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply correction
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          python3 scripts/fix-executive-incapacity-crossrefs-260915.py
      - name: Regenerate and validate
        run: |
          set -euo pipefail
          npm ci
          npm run sync
          python3 scripts/build-scenario-index.py
          python3 -m pip install --quiet reportlab pypdf
          python3 scripts/build-constitution-pdf.py
          python3 scripts/check-constitution-pdf.py
          python3 scripts/check-consistency.py
          python3 scripts/check-constitutional-site.py
          npm run build
          ! grep -q 'decline under §2.16(4)' docs/constitution-current.md annotated.html docs/constitutional-quickref.md
          ! grep -q 'governed by §2.16(6)' docs/constitution-current.md annotated.html docs/constitutional-quickref.md
          grep -q 'decline under §2.16(7)' docs/constitution-current.md
          grep -q 'governed by §2.16(9)' docs/constitution-current.md
          ! grep -q 'TRANSMITTED TO:' scenario-the-twenty-four-hours.html
      - name: Commit correction
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-executive-incapacity-crossrefs-260915.yml scripts/fix-executive-incapacity-crossrefs-260915.py
          git config user.name 'federated-republic-maintenance'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Correct executive incapacity cross references'
          git push origin main
