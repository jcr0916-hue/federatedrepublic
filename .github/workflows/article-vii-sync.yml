name: Article VII sync
on:
  push:
    branches: [constitutional-review-2026-10-08-article-vii]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: constitutional-review-2026-10-08-article-vii
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python3 scripts/article-vii-approved.py
          python3 scripts/build-constitution-md.py constitution_data.json docs/constitution-current.md
          python3 scripts/build-quickref.py constitution_data.json docs/constitutional-quickref.md
          python3 scripts/sync-annotated.py
          python3 scripts/build-search-index.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add constitution_data.json docs/constitution-current.md docs/constitutional-quickref.md annotated.html search-index.js
          git diff --cached --quiet || (git commit -m 'Apply approved Article VII revisions' && git push)
