name: Temporary Statehood fiscal synchronization
on:
  push:
    branches:
      - constitution/statehood-audit-fiscal-capacity
    paths:
      - .github/workflows/sync-statehood-fiscal.yml
permissions:
  contents: write
jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: constitution/statehood-audit-fiscal-capacity
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Archive previous complete pair and regenerate canonical publications
        run: |
          python3 - <<'PY'
          import json, runpy
          from pathlib import Path
          root = Path.cwd()
          archive = runpy.run_path('scripts/constitution-archive.py')
          before = archive['pair'](root, 'origin/main')
          archive['validate_pair'](root, before, 'origin/main')
          plan = archive['plan_pair'](root, before, None, 'origin/main')
          archive['write_pair'](root, before, plan)
          data = json.loads(Path('constitution_data.json').read_text())
          render = runpy.run_path('scripts/build-constitution-md.py')['render']
          Path('docs/constitution-current.md').write_text(render(data), encoding='utf-8')
          PY
          python3 scripts/sync-annotated.py
          python3 scripts/build-quickref.py constitution_data.json docs/constitutional-quickref.md
          python3 scripts/build-search-index.py
      - name: Commit synchronized constitutional publications
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/constitution-current.md docs/constitutional-quickref.md annotated.html search-index.js docs/archive/constitution
          if ! git diff --cached --quiet; then
            git commit -m 'Regenerate Constitution publications for fiscal capacity'
            git push origin HEAD:constitution/statehood-audit-fiscal-capacity
          fi
