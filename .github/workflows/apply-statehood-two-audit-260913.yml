name: Apply two-audit Statehood correction

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-statehood-two-audit-260913.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Archive current Markdown first
        run: |
          test ! -e docs/Constitution-260913-a.md
          cp docs/constitution-current.md docs/Constitution-260913-a.md
          git config user.name 'jcr0916-hue'
          git config user.email 'jcr0916@gmail.com'
          git add docs/Constitution-260913-a.md
          git commit -m 'Archive Constitution-260913-a before Statehood correction'
          git push origin HEAD:main

      - name: Apply approved Statehood correction
        run: python3 scripts/apply-statehood-two-audit-260913.py

      - name: Rebuild derived constitutional files
        run: |
          python3 scripts/build-constitution-md.py constitution_data.json docs/constitution-current.md
          python3 scripts/build-quickref.py constitution_data.json docs/constitutional-quickref.md
          python3 scripts/build-search-index.py

      - name: Validate
        run: |
          python3 -m json.tool constitution_data.json >/dev/null
          python3 scripts/check-consistency.py
          python3 - <<'PY'
          import json
          d=json.load(open('constitution_data.json',encoding='utf-8'))
          p=next(p for a in d for p in a.get('provisions',[]) if p.get('num')=='§15.2')
          assert 'two years after publication of the first successful audit' in p['text']
          assert 'second successful Statehood Audit' in p['text']
          s=open('_data/stats.js',encoding='utf-8').read()
          assert s.count('First audit passed · awaiting second') >= 2
          print('Two-audit Statehood rule and Torenthia status ledger validated.')
          PY

      - name: Remove one-shot machinery
        run: |
          rm -f scripts/apply-statehood-two-audit-260913.py
          rm -f .github/workflows/apply-statehood-two-audit-260913.yml

      - name: Commit correction
        run: |
          git add -A constitution_data.json docs/constitution-current.md docs/constitutional-quickref.md search-index.js annotated.html _data/stats.js docs/KORDA-CONVENTION-ARC.md scripts/apply-statehood-two-audit-260913.py .github/workflows/apply-statehood-two-audit-260913.yml
          git commit -m 'Require two successful audits for Statehood'
          git push origin HEAD:main
