name: Constitution archival
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - constitution_data.json
      - docs/constitution-current.md
      - scripts/build-constitution-md.py
      - scripts/constitution-archive.py
      - scripts/constitution-archive-aliases.json
      - scripts/test-constitution-archive.py
      - 'docs/archive/constitution/**'
      - .github/workflows/constitution-archive.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archive-check:
    if: github.event_name == 'pull_request'
    name: Constitution archival check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -B scripts/test-constitution-archive.py
      - name: Reject unarchived replacements and changes to historical archives
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 -B scripts/constitution-archive.py check --base "$BASE_SHA"
  recover-archives:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    name: Recover previous Constitution pairs
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: constitution-archive-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -B scripts/test-constitution-archive.py
      - name: Catch up from the permanent baseline and push archives only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python3 -B scripts/constitution-archive.py reconcile
            git add docs/archive/constitution
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m 'Archive previous Constitution JSON and Markdown pairs'
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          echo 'Could not save archives after three attempts; inspect permissions or rerun after concurrent pushes stop.' >&2
          exit 1
