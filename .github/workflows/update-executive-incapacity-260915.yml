name: Apply revised executive incapacity framework

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-executive-incapacity-260915.yml'
      - 'scripts/update-executive-incapacity-260915.py'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply source changes
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          python3 scripts/update-executive-incapacity-260915.py
      - name: Regenerate and validate constitutional artifacts
        run: |
          set -euo pipefail
          npm ci
          npm run sync
          python3 scripts/build-scenario-index.py
          python3 -m pip install --quiet reportlab pypdf
          python3 scripts/build-constitution-pdf.py
          python3 scripts/check-constitution-pdf.py
          python3 scripts/check-consistency.py
          python3 scripts/check-constitutional-site.py
          python3 scripts/check-scenarios.py
          npm test --if-present
          npm run build
      - name: Refresh Article II quick-sheet PDF
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright
          npx playwright install chromium
          python3 -m http.server 8765 -d _site >/tmp/fed-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          node - <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage();
            await page.goto('http://127.0.0.1:8765/quicksheet-article-2.html', {waitUntil:'networkidle'});
            await page.evaluate(() => document.fonts.ready);
            await page.pdf({path:'pdf/quicksheet-article-2.pdf', printBackground:true, preferCSSPageSize:true});
            await browser.close();
          })();
          NODE
      - name: Verify revised mechanics
        run: |
          set -euo pipefail
          ! grep -q 'other Consul and Chief Justice' scenario-the-twenty-four-hours.html torenthia-nrs-012.html quicksheet-article-2.html
          ! grep -q 'accountability chamber.*restore' scenario-the-twenty-four-hours.html torenthia-nrs-012.html quicksheet-article-2.html
          grep -q 'two-thirds' scenario-the-twenty-four-hours.html
          grep -q 'selected by lot' torenthia-nrs-012.html
          grep -q 'Political or policy disagreement alone is not incapacity' docs/constitution-current.md
      - name: Commit synchronized changes
        run: |
          set -euo pipefail
          rm -f .github/workflows/update-executive-incapacity-260915.yml scripts/update-executive-incapacity-260915.py
          git config user.name 'federated-republic-maintenance'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'Revise executive incapacity safeguards'
          git push origin main
