name: Regenerate Constitution PDF

on:
  push:
    branches:
      - biennial-statehood-audits
    paths:
      - .github/workflows/regenerate-constitution-pdf.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: biennial-statehood-audits
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Serve built site
        run: |
          python3 -m http.server 8765 --directory _site >/tmp/fr-http.log 2>&1 &
          echo $! > /tmp/fr-http.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8765/constitution-print.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/fr-http.log
          exit 1
      - name: Build Constitution PDF
        run: node scripts/build-constitution-pdf.cjs http://127.0.0.1:8765
      - name: Validate changed Statehood Audit text
        run: |
          python -m pip install pypdf
          python - <<'PY'
          from pypdf import PdfReader
          text = "\n".join((p.extract_text() or "") for p in PdfReader("pdf/constitution-current.pdf").pages)
          required = [
              "two consecutive biennial Statehood Audits",
              "Every State is subject to a biennial Statehood Audit",
              "overall failed biennial Statehood Audit",
              "The biennial Statehood Audit under §15.2 applies to all States",
          ]
          forbidden = [
              "two consecutive annual Statehood Audits",
              "Every State is subject to an annual Statehood Audit",
              "overall failed annual Statehood Audit",
              "The annual Statehood Audit under §15.2 applies to all States",
          ]
          for phrase in required:
              assert phrase in text, f"Missing required PDF text: {phrase}"
          for phrase in forbidden:
              assert phrase not in text, f"Stale PDF text remains: {phrase}"
          print("Biennial Statehood Audit text verified in PDF.")
          PY
      - name: Commit regenerated PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pdf/constitution-current.pdf
          if git diff --cached --quiet; then
            echo "PDF already current."
          else
            git commit -m "Regenerate Constitution PDF for biennial audits"
            git push origin HEAD:biennial-statehood-audits
          fi
