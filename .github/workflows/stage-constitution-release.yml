name: Stage Constitution Release Artifacts

on:
  push:
    branches: [release-review-constitution-261023]
    paths: ['.github/workflows/stage-constitution-release.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - run: npm ci
      - name: Rebuild review branch outputs
        run: |
          python3 scripts/sync-annotated.py
          python3 scripts/build-search-index.py
          python3 scripts/build-constitution-md.py constitution_data.json docs/release-generated.md
          cp docs/release-generated.md docs/constitution-current.md
          python3 scripts/build-quickref.py constitution_data.json docs/constitutional-quickref.md
          python3 scripts/check-constitutional-site.py
          npm run build
          python3 scripts/check-consistency.py
      - name: Render and check PDF
        run: |
          python3 -m pip install --quiet pypdf
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          python3 -m http.server 8765 --directory _site > /tmp/release-http.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          node scripts/build-constitution-pdf.cjs http://localhost:8765
          python3 scripts/check-constitution-pdf.py
          python3 scripts/check-pdf-accessibility.py
      - name: Stage generated files on review branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add annotated.html search-index.js docs/constitution-current.md docs/constitutional-quickref.md pdf/constitution-current.pdf
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "Stage generated Constitution artifacts for release review"
            git push origin HEAD:release-review-constitution-261023
          fi
