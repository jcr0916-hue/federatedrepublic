name: One-time constitutional artifact synchronization
on:
  push:
    branches:
      - constitutional-review-2026-10-08-article-vi
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: constitutional-review-2026-10-08-article-vi
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate canonical constitutional artifacts
        run: |
          python3 scripts/build-constitution-md.py constitution_data.json docs/constitution-current.md
          python3 scripts/build-quickref.py constitution_data.json docs/constitutional-quickref.md
          python3 scripts/build-search-index.py
      - name: Commit synchronized generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/constitution-current.md docs/constitutional-quickref.md search-index.js
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate constitutional artifacts from canonical source"
            git push origin HEAD:constitutional-review-2026-10-08-article-vi
          fi
