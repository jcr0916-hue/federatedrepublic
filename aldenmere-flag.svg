<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc">
<title id="title">Flag of Aldenmere</title>
<desc id="desc">Deep navy field with a cream cross edged in gold, four gold eight-pointed stars, and a central gold-ringed medallion showing green mountains reflected in a dark blue lake.</desc>
<defs>
  <clipPath id="medallion"><circle cx="768" cy="512" r="286"/></clipPath>
  <g id="star" fill="#E1AB30">
    <path d="M0-92 20-32 65-65 32-20 92 0 32 20 65 65 20 32 0 92-20 32-65 65-32 20-92 0-32-20-65-65-20-32Z"/>
  </g>
</defs>

<rect width="1536" height="1024" fill="#063A72"/>

<!-- gold-edged cream cross -->
<rect x="644" width="248" height="1024" fill="#E1AB30"/>
<rect x="674" width="188" height="1024" fill="#F4EBDD"/>
<rect y="388" width="1536" height="248" fill="#E1AB30"/>
<rect y="418" width="1536" height="188" fill="#F4EBDD"/>

<!-- four stars -->
<use href="#star" transform="translate(300 225)"/>
<use href="#star" transform="translate(1236 225)"/>
<use href="#star" transform="translate(300 799)"/>
<use href="#star" transform="translate(1236 799)"/>

<!-- central medallion -->
<circle cx="768" cy="512" r="316" fill="#E1AB30"/>
<circle cx="768" cy="512" r="286" fill="#063A72"/>

<g clip-path="url(#medallion)">
  <!-- sky -->
  <rect x="482" y="226" width="572" height="286" fill="#063A72"/>

