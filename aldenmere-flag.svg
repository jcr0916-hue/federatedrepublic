  <!-- lake -->
  <rect x="482" y="544" width="572" height="254" fill="#0A4D83"/>
  <path d="M482 555H1054" stroke="#F4EBDD" stroke-width="10"/>
  <g fill="#F4EBDD">
    <path d="M520 578H1016L942 590H594Z"/>
    <path d="M565 612H971L906 624H630Z"/>
    <path d="M605 646H931L876 658H660Z"/>
    <path d="M638 680H898L850 692H686Z"/>
    <path d="M675 714H861L825 726H711Z"/>
    <path d="M712 748H824L796 760H740Z"/>
  </g>
  <g fill="#2D6D9A">
    <path d="M535 596H1001L930 605H606Z"/>
    <path d="M587 630H949L890 639H646Z"/>
    <path d="M627 664H909L862 673H674Z"/>
