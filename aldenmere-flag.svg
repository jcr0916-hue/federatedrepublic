  <path d="M700 353 721 322 748 359 770 391 744 377 728 360 714 372Z" fill="#F4EBDD"/>
  <path d="M832 385 854 350 883 383 904 421 879 403 860 388 846 399Z" fill="#F4EBDD"/>

  <!-- treeline -->
  <g fill="#123E34">
    <path d="M500 526 520 476 540 526Z"/><path d="M530 528 552 466 574 528Z"/>
    <path d="M564 530 585 481 606 530Z"/><path d="M590 531 613 470 636 531Z"/>
    <path d="M624 532 646 484 668 532Z"/><path d="M650 532 674 472 698 532Z"/>
    <path d="M836 532 860 472 884 532Z"/><path d="M868 532 890 486 912 532Z"/>
    <path d="M900 531 923 470 946 531Z"/><path d="M935 530 956 482 977 530Z"/>
    <path d="M965 528 987 466 1009 528Z"/><path d="M997 526 1017 476 1037 526Z"/>
