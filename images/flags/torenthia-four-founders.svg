<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" role="img" aria-labelledby="title desc">
  <title id="title">Four Founders — Torenthia's national flag</title>
  <desc id="desc">Four muted goldenrod diagonal saltire arms on a deep navy field, bordered by thin white lines edged in dark red. A pure white four-point star at the center has no outline.</desc>
  <rect width="900" height="600" fill="#10243f"/>
  <!-- Each arm runs from a corner to the shared center. Dark red edges the
       thin white lines; neither color is used to outline the central star. -->
  <g fill="none" stroke-linecap="butt">
    <path d="M-45-30 450 300M945-30 450 300M945 630 450 300M-45 630 450 300" stroke="#7c2938" stroke-width="88"/>
    <path d="M-45-30 450 300M945-30 450 300M945 630 450 300M-45 630 450 300" stroke="#ffffff" stroke-width="80"/>
    <path d="M-45-30 450 300M945-30 450 300M945 630 450 300M-45 630 450 300" stroke="#b49b5c" stroke-width="72"/>
  </g>
  <!-- The star is painted last, in pure white, with no stroke or red outline. -->
  <path id="union-star" d="M450 180 478 272 570 300 478 328 450 420 422 328 330 300 422 272Z" fill="#ffffff" stroke="none"/>
</svg>
